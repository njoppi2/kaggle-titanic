name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile project sources
        run: python -m compileall xgboost.py

      - name: Generate reproducible baseline artifacts
        run: python scripts/reproducible_baseline.py

      - name: Validate solution files
        run: python -m unittest discover -s tests -p "test_*.py"
