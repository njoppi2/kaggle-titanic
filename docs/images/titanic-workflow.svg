<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Titanic Workflow</title>
  <desc id="desc">Dataset preparation, feature engineering, training, and submission generation flow.</desc>
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 10; }
      .title { font: 600 18px sans-serif; fill: #111827; }
      .label { font: 500 14px sans-serif; fill: #111827; }
      .arrow { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e" />
    </marker>
  </defs>

  <text x="20" y="36" class="title">Modeling Pipeline</text>

  <rect class="box" x="30" y="90" width="155" height="64" />
  <text x="65" y="128" class="label">Raw CSV Data</text>

  <rect class="box" x="225" y="90" width="175" height="64" />
  <text x="252" y="128" class="label">Feature Engineering</text>

  <rect class="box" x="440" y="90" width="130" height="64" />
  <text x="468" y="128" class="label">Training</text>

  <rect class="box" x="610" y="90" width="130" height="64" />
  <text x="644" y="128" class="label">Evaluation</text>

  <rect class="box" x="760" y="90" width="130" height="64" />
  <text x="782" y="128" class="label">Submission</text>

  <path class="arrow" d="M185 122 H217" />
  <path class="arrow" d="M400 122 H432" />
  <path class="arrow" d="M570 122 H602" />
  <path class="arrow" d="M740 122 H752" />

  <rect class="box" x="285" y="215" width="330" height="64" />
  <text x="322" y="252" class="label">Tests: solution file format + content checks</text>
  <path class="arrow" d="M505 154 V207" />
</svg>
